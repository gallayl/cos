name: Doxygen Check

on:
  workflow_call:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs-check: ${{ steps.filter.outputs.docs-check }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref || github.event.before }}
          filters: |
            docs-check:
              - 'docs/**'
              - '**/*.md'
              - 'Doxyfile*'
              - 'components/**'
              - 'main/**'
              - '.github/workflows/docs-check.yml'

  docs-check:
    name: Doxygen Check
    needs: changes
    if: needs.changes.outputs.docs-check == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen

      - name: Check documentation
        run: make docs-check

  required:
    name: Required
    runs-on: ubuntu-latest
    if: always()
    needs:
      - changes
      - docs-check
    steps:
      - name: Verify documentation check results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          DOCS_CHECK: ${{ needs.docs-check.result }}
        run: |
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "Change detection failed: $CHANGES_RESULT"
            exit 1
          fi

          if [[ "$DOCS_CHECK" != "success" &&
                "$DOCS_CHECK" != "skipped" ]]; then
            echo "Documentation check failed: $DOCS_CHECK"
            exit 1
          fi

          if [[ "$DOCS_CHECK" == "skipped" ]]; then
            echo "Documentation check skipped: $DOCS_CHECK"
            exit 0
          fi

          echo "All required CI checks passed"

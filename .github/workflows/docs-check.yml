name: Doxygen Check

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs-check: ${{ steps.docs-check.outputs.docs-check }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            docs-check:
              - 'docs/**'
              - '**/*.md'
              - 'Doxyfile*'
              - 'components/**'
              - 'main/**'
              - '.github/workflows/docs-check.yml'

  docs-check:
    name: Doxygen Check
    if: needs.changes.outputs.docs-check == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen

      - name: Check documentation
        run: make docs-check

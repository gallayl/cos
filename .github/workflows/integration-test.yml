name: Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  integration-test:
    name: Integration Tests (${{ matrix.suite }})
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.1
    strategy:
      fail-fast: false
      matrix:
        suite:
          - esp_littlefs
          - init_sequence
          - nvs_calibration
          - shell_fs
          - stability
          - system
          - vfs_ops
    env:
      IDF_CCACHE_ENABLE: "1"
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - uses: actions/checkout@v4

      - name: Mark workspace as a safe Git directory
        shell: bash
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install QEMU, ccache, and test tools
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ccache
          . $IDF_PATH/export.sh
          python $IDF_PATH/tools/idf_tools.py install qemu-xtensa
          eval "$(python $IDF_PATH/tools/idf_tools.py export)"
          python -m pip install --upgrade pip
          python -m pip install -r integration_test/requirements.txt

      - name: Restore pip cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-integration-${{ runner.os }}-idf-v6.1-${{ matrix.suite }}-${{ hashFiles('integration_test/requirements.txt', '.github/workflows/integration-test.yml') }}
          restore-keys: |
            pip-integration-${{ runner.os }}-idf-v6.1-${{ matrix.suite }}-
            pip-integration-${{ runner.os }}-idf-v6.1-

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-integration-${{ runner.os }}-idf-v6.1-${{ matrix.suite }}-${{ hashFiles('CMakeLists.txt', 'Makefile', 'sdkconfig.defaults', 'main/**', 'components/**', 'partitions.csv', format('integration_test/test_{0}/**', matrix.suite), '.github/workflows/integration-test.yml') }}
          restore-keys: |
            ccache-integration-${{ runner.os }}-idf-v6.1-${{ matrix.suite }}-
            ccache-integration-${{ runner.os }}-idf-v6.1-

      - name: Restore integration test build directory
        uses: actions/cache@v4
        with:
          path: integration_test/test_${{ matrix.suite }}/build
          key: itest-build-${{ runner.os }}-idf-v6.1-${{ matrix.suite }}-${{ hashFiles('CMakeLists.txt', 'Makefile', 'sdkconfig.defaults', 'main/**', 'components/**', 'partitions.csv', format('integration_test/test_{0}/**', matrix.suite), '.github/workflows/integration-test.yml') }}
          restore-keys: |
            itest-build-${{ runner.os }}-idf-v6.1-${{ matrix.suite }}-

      - name: Build integration test firmware (${{ matrix.suite }})
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          eval "$(python $IDF_PATH/tools/idf_tools.py export)"
          ccache --zero-stats || true
          make integration-test-build-${{ matrix.suite }}
          ccache --show-stats || true

      - name: Upload integration test firmware
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-firmware-${{ matrix.suite }}
          path: |
            integration_test/test_${{ matrix.suite }}/build/*.elf
          if-no-files-found: ignore
          retention-days: 14

      - name: Run integration tests (${{ matrix.suite }})
        timeout-minutes: 5
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          eval "$(python $IDF_PATH/tools/idf_tools.py export)"
          make integration-test-run-${{ matrix.suite }}

      - name: Collect embedded test logs
        if: always()
        shell: bash
        run: |
          if [ -d /tmp/pytest-embedded ]; then
            mkdir -p "$GITHUB_WORKSPACE/pytest-embedded-logs"
            cp -a /tmp/pytest-embedded/. "$GITHUB_WORKSPACE/pytest-embedded-logs/"
          fi

      - name: Upload embedded test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-logs-${{ matrix.suite }}
          path: |
            pytest-embedded-logs/
            integration_test/test_${{ matrix.suite }}/build/*.elf
          if-no-files-found: ignore
          retention-days: 14

      - name: Decode QEMU panic backtraces
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          python - <<'PY'
          import os
          import re
          import subprocess
          from pathlib import Path

          workspace = Path(os.environ["GITHUB_WORKSPACE"])
          suite = os.environ.get("SUITE", "")
          logs = workspace / "pytest-embedded-logs"
          tools = Path("/opt/esp/tools/xtensa-esp-elf")
          addr2line_candidates = list(tools.glob("*/xtensa-esp-elf/bin/xtensa-esp32-elf-addr2line"))
          if not addr2line_candidates:
              print("xtensa-esp32-elf-addr2line is not available")
              raise SystemExit(0)
          addr2line = str(addr2line_candidates[0])

          seen = set()
          for log_path in sorted(logs.rglob("dut.log")):
              project = None
              traces = []
              with log_path.open(encoding="utf-8", errors="replace") as log:
                  for line in log:
                      if project is None:
                          project_match = re.search(r"Project name:\s*(\S+)", line)
                          if project_match is not None:
                              project = project_match.group(1)
                      if "Backtrace:" in line:
                          traces.append(line.partition("Backtrace:")[2])

              if project is None or (suite and project != f"test_{suite}"):
                  continue

              for trace in traces:
                  elf = workspace / "integration_test" / project / "build" / f"{project}.elf"
                  if not elf.is_file():
                      continue

                  addresses = tuple(re.findall(r"(0x[0-9a-fA-F]+):0x[0-9a-fA-F]+", trace))
                  key = (project, addresses)
                  if not addresses or key in seen:
                      continue
                  seen.add(key)

                  print(f"\n{log_path.relative_to(logs)} ({project})")
                  result = subprocess.run(
                      [addr2line, "-pfiaC", "-e", str(elf), *addresses],
                      check=False,
                      capture_output=True,
                      text=True,
                  )
                  print(result.stdout, end="")
                  if result.stderr:
                      print(result.stderr, end="")
          PY
        env:
          SUITE: ${{ matrix.suite }}

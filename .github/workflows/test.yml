name: Unit Tests

on:
  push:
    branches: [main]
    paths:
      - "components/**"
      - "main/**"
      - "test/**"
      - "CMakeLists.txt"
      - "Makefile"
      - "**/CMakeLists.txt"
      - ".github/workflows/test.yml"
  pull_request:
    paths:
      - "components/**"
      - "main/**"
      - "test/**"
      - "CMakeLists.txt"
      - "Makefile"
      - "**/CMakeLists.txt"
      - ".github/workflows/test.yml"

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: make test

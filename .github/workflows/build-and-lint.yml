name: Build & Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-lint:
    name: ESP-IDF Build & Lint
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5.2
    steps:
      - uses: actions/checkout@v4

      - name: Install ESP-IDF clang tools
        run: python3 "$IDF_PATH/tools/idf_tools.py" install esp-clang

      - name: Build firmware
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          make build

      - name: Run clang-tidy
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          include_paths() {
            "$1" -E -x "$2" - -v </dev/null 2>&1 |
              sed -n '/#include <...> search starts here:/,/End of search list/{/#include <...> search starts here:/d; /End of search list/d; s/^[[:space:]]*//; p}'
          }
          c_include_paths="$(include_paths xtensa-esp32-elf-gcc c)"
          cxx_include_paths="$(include_paths xtensa-esp32-elf-g++ c++)"
          export CPATH="${c_include_paths}:${cxx_include_paths}"
          make lint

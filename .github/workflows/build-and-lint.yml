name: Build & Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      build-and-lint: ${{ steps.build-and-lint.outputs.build-and-lint }}

    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            build-and-lint:
              - 'components/**'
              - 'main/**'
              - 'CMakeLists.txt'
              - 'Makefile'
              - '**/CMakeLists.txt'
              - 'sdkconfig*'
              - 'partitions.csv'
              - '.clang-tidy'
              - '.github/workflows/build-and-lint.yml'

  build-and-lint:
    needs: changes
    if: needs.changes.outputs.build-and-lint == 'true'
    name: ESP-IDF Build & Lint
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.1
    env:
      IDF_CCACHE_ENABLE: "1"
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - uses: actions/checkout@v4

      - name: Install ESP-IDF clang tools and ccache
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ccache
          python3 "$IDF_PATH/tools/idf_tools.py" install esp-clang

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-build-lint-${{ runner.os }}-idf-v6.1-${{ hashFiles('CMakeLists.txt', 'Makefile', 'sdkconfig.defaults', 'main/**', 'components/**', 'partitions.csv', '.github/workflows/build-and-lint.yml') }}
          restore-keys: |
            ccache-build-lint-${{ runner.os }}-idf-v6.1-

      - name: Build firmware
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          ccache --zero-stats || true
          make build
          ccache --show-stats || true

      - name: Generate Clang compile database
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          make lint-db

      - name: Run clang-tidy
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          export TIDY_COMPILE_COMMANDS=build/clang/compile_commands.json
          make lint

  required:
    name: required
    runs-on: ubuntu-latest
    if: always()
    needs:
      - changes
      - build-and-lint
    steps:
      - name: Verify build and lint results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          BUILD_AND_LINT_RESULT: ${{ needs.build-and-lint.result }}
        run: |
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "Change detection failed: $CHANGES_RESULT"
            exit 1
          fi

          if [[ "$BUILD_AND_LINT_RESULT" != "success" &&
                "$BUILD_AND_LINT_RESULT" != "skipped" ]]; then
            echo "Build and lint failed: $BUILD_AND_LINT_RESULT"
            exit 1
          fi

          if [[ "$BUILD_AND_LINT_RESULT" == "skipped" ]]; then
            echo "No changes detected for build and lint. Skipping."
            exit 0
          fi

          echo "All required CI checks passed"

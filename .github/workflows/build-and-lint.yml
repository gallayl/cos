name: Build & Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-lint:
    name: ESP-IDF Build & Lint
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5.2
    steps:
      - uses: actions/checkout@v4

      - name: Install ESP-IDF clang tools
        run: python3 "$IDF_PATH/tools/idf_tools.py" install esp-clang

      - name: Build firmware
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          make build

      - name: Run clang-tidy
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          make lint

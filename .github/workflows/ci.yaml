name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    uses: ./.github/workflows/build-and-lint.yml

  format-check:
    uses: ./.github/workflows/format-check.yml
  frontend:
    uses: ./.github/workflows/frontend.yml
  integration-tests:
    uses: ./.github/workflows/integration-test.yml
  test:
    uses: ./.github/workflows/test.yml

  ci_required:
    name: CI Checks Required
    runs-on: ubuntu-latest
    needs: [lint, format-check, frontend, integration-tests, test]
    if: always()
    steps:
      - name: Verify CI results
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          FORMAT_CHECK_RESULT: ${{ needs.format-check.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          INTEGRATION_TESTS_RESULT: ${{ needs.integration-tests.result }}
          TESTS_RESULT: ${{ needs.test.result }}
        run: |
          if [[ "$LINT_RESULT" != "success" ]]; then
            echo "Lint failed: $LINT_RESULT"
            exit 1
          fi

          if [[ "$FORMAT_CHECK_RESULT" != "success" &&
                "$FORMAT_CHECK_RESULT" != "skipped" ]]; then
            echo "Format check failed: $FORMAT_CHECK_RESULT"
            exit 1
          fi

          if [[ "$FRONTEND_RESULT" != "success" ]]; then
            echo "Frontend failed: $FRONTEND_RESULT"
            exit 1
          fi

          if [[ "$INTEGRATION_TESTS_RESULT" != "success" ]]; then
            echo "Integration tests failed: $INTEGRATION_TESTS_RESULT"
            exit 1
          fi

          if [[ "$TESTS_RESULT" != "success" ]]; then
            echo "Unit tests failed: $TESTS_RESULT"
            exit 1
          fi

name: Frontend

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref || github.event.before }}
          filters: |
            frontend:
              - 'frontend/**'
              - 'storage/ts/**'
              - 'storage/flash_data/**'
              - '.github/workflows/frontend.yml'

  check:
    name: Lint, format, test, and build
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Format check
        run: yarn format:check

      - name: Lint
        run: yarn lint

      - name: Test
        run: yarn test

      - name: Build
        run: yarn build

  required:
    name: Required
    runs-on: ubuntu-latest
    if: always()
    needs:
      - changes
      - check
    steps:
      - name: Verify frontend results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          FRONTEND: ${{ needs.check.result }}
        run: |
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "Change detection failed: $CHANGES_RESULT"
            exit 1
          fi

          if [[ "$FRONTEND" != "success" &&
                "$FRONTEND" != "skipped" ]]; then
            echo "Frontend check failed: $FRONTEND"
            exit 1
          fi

          if [[ "$FRONTEND" == "skipped" ]]; then
            echo "No frontend changes detected. Skipping frontend check."
            exit 0
          fi

          echo "Frontend check passed."
